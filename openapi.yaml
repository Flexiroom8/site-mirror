openapi: 3.0.0
info:
  title: Site Mirror API
  version: 1.0.0
  description: Same‑origin website archiving tool

servers:
  - url: http://localhost:3000

paths:
  /mirror/jobs:
    post:
      summary: Start a new mirror job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MirrorJobInput'
      responses:
        '201':
          description: Job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorJob'
        '400':
          description: Invalid input
    get:
      summary: List recent mirror jobs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum number of jobs to return (most recent first)
      responses:
        '200':
          description: List of jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/MirrorJob'

  /mirror/jobs/{id}:
    get:
      summary: Get a single job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorJob'
        '404':
          description: Job not found

    delete:
      summary: Cancel a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MirrorJob'
        '404':
          description: Job not found

  /mirror/jobs/{id}/zip:
    get:
      summary: Download the mirror archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ZIP file
          content:
            application/zip: {}
        '404':
          description: Job not found
        '409':
          description: Mirror not completed

components:
  schemas:
    MirrorJobInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          example: https://example.com
        maxPages:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
        requestDelayMs:
          type: integer
          minimum: 0
          maximum: 30000
          default: 250
        respectRobotsTxt:
          type: boolean
          default: true
        maxDepth:
          type: integer
          minimum: 0
          maximum: 10
          default: 3
        includeAssets:
          type: boolean
          default: true
        pathPrefix:
          type: string
          default: "/"
        excludePaths:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
          minimum: 60000
          maximum: 3600000
          default: 900000
          description: Job timeout in milliseconds
        maxTotalBytes:
          type: integer
          minimum: 1048576
          maximum: 2147483648
          default: 524288000
          description: Maximum total bytes to download

    MirrorJob:
      type: object
      required:
        - id
        - url
        - status
        - pagesFound
        - pagesDownloaded
        - assetsDownloaded
        - bytesDownloaded
        - maxPages
        - requestDelayMs
        - respectRobotsTxt
        - maxDepth
        - includeAssets
        - pathPrefix
        - excludePaths
        - timeoutMs
        - maxTotalBytes
        - createdAt
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        pagesFound:
          type: integer
        pagesDownloaded:
          type: integer
        assetsDownloaded:
          type: integer
        bytesDownloaded:
          type: integer
        maxPages:
          type: integer
        requestDelayMs:
          type: integer
        respectRobotsTxt:
          type: boolean
        maxDepth:
          type: integer
        includeAssets:
          type: boolean
        pathPrefix:
          type: string
        excludePaths:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
        maxTotalBytes:
          type: integer
        currentUrl:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
